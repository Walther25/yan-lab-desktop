<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YAN LAB · PLANNER</title>
<style>
  :root {
    --paper: #e8e5e1; --panel: #edebe4; --ink: #080a08; --ink-2: #242622; --muted: #8c8373;
    --soft: #b8b1a3; --line: #c9c3b6; --line-2: #d6d0c4; --hover: #e2dccf; --accent: #67634c; --danger: #8a3b2e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "MiSans", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; display: flex; flex-direction: column;
  }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; padding: 0; }
  .wrap { flex: 1; display: flex; flex-direction: column; padding: 34px 44px 26px; min-height: 0; }
  .top { display: flex; justify-content: space-between; align-items: center; font-size: 11px; letter-spacing: 1.4px;
    padding-bottom: 22px; border-bottom: 1px solid var(--line); }
  .top .state { color: var(--muted); font-size: 10px; }
  .top .state i { font-style: normal; color: var(--accent); margin: 0 7px; font-size: 8px; }
  h1 { font-size: 34px; letter-spacing: -.6px; margin: 30px 0 6px; display: flex; align-items: baseline; gap: 18px; font-weight: 700; }
  h1 small { font-size: 13px; letter-spacing: 2px; color: var(--muted); font-weight: 400; }
  .tabs { display: flex; gap: 28px; padding: 20px 0 18px; border-bottom: 1px solid var(--line); font-size: 12px; }
  .tabs button { color: var(--muted); display: inline-flex; gap: 8px; align-items: center; letter-spacing: .5px; }
  .tabs button::before { content: ""; width: 4px; height: 4px; background: currentColor; visibility: hidden; }
  .tabs button[aria-selected="true"] { color: var(--ink); }
  .tabs button[aria-selected="true"]::before { visibility: visible; }
  .head { display: grid; grid-template-columns: 52px minmax(0, 1fr) 170px 96px 74px; gap: 14px; padding: 13px 0;
    font-size: 9px; letter-spacing: 1px; color: #82796a; border-bottom: 1px solid var(--line); }
  .tasks .head { grid-template-columns: 52px minmax(0, 1fr) 74px; }
  .list { flex: 1; overflow-y: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: #bbb4a6 transparent; }
  .row { display: grid; grid-template-columns: 52px minmax(0, 1fr) 170px 96px 74px; gap: 14px; align-items: center;
    min-height: 62px; border-bottom: 1px solid var(--line-2); transition: background .2s; }
  .tasks .row { grid-template-columns: 52px minmax(0, 1fr) 74px; }
  .row:hover, .row:focus-within { background: var(--hover); }
  .row .no { font-size: 15px; font-variant-numeric: tabular-nums; padding-left: 2px; }
  .row.past { opacity: .5; }
  .row .tag { font-size: 8px; letter-spacing: 1px; color: var(--muted); display: block; margin-top: 3px; }
  input[type="text"], input[type="date"], input[type="time"] {
    width: 100%; background: transparent; border: 0; border-bottom: 1px solid transparent; padding: 8px 0;
    font-size: 15px; outline: none; transition: border-color .2s;
  }
  input[type="date"], input[type="time"] { font-size: 13px; font-variant-numeric: tabular-nums; }
  input:focus { border-bottom-color: var(--ink); }
  input::placeholder { color: #a39b8c; }
  .acts { display: flex; justify-content: flex-end; gap: 4px; padding-right: 6px; }
  .acts button { width: 22px; height: 26px; color: var(--muted); font-size: 13px; line-height: 26px; text-align: center; }
  .acts button:hover { color: var(--ink); }
  .acts button.del:hover { color: var(--danger); }
  .empty { padding: 48px 0; text-align: center; color: var(--muted); font-size: 13px; }
  .empty strong { display: block; color: var(--ink-2); font-size: 16px; font-weight: 500; margin-bottom: 8px; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 18px; }
  .add { background: #252820; color: #f3f1ea; font-size: 11px; letter-spacing: 1.2px; padding: 0 22px; height: 40px;
    display: inline-flex; align-items: center; gap: 10px; }
  .add:hover { background: #121410; }
  .add:disabled { opacity: .35; cursor: default; }
  .ghost { font-size: 10px; letter-spacing: 1.2px; color: var(--muted); padding: 10px 0; }
  .ghost:hover { color: var(--ink); }
  .foot { display: flex; justify-content: space-between; font-size: 9px; letter-spacing: 1px; color: #8d8575; padding-top: 18px; }
  .hint { font-size: 11px; color: var(--muted); margin: 0; }
  :focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #141513; --panel: #1a1b19; --ink: #ecebe6; --ink-2: #d9d7cf; --muted: #8f897c; --soft: #5d594f;
      --line: #34352f; --line-2: #2b2c27; --hover: #1f201d; --accent: #a8a27f; --danger: #d0705e; }
    .add { background: #ecebe6; color: #141513; }
    .add:hover { background: #ffffff; }
    input[type="date"], input[type="time"] { color-scheme: dark; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span>YAN LAB / PLANNER</span><span class="state" id="state">CONNECTING</span></div>
  <h1><span id="title">TODAY'S TASKS</span><small id="subtitle">Personal workspace</small></h1>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-tasks" data-view="tasks" aria-selected="true">Today's tasks</button>
    <button role="tab" id="tab-events" data-view="events" aria-selected="false">Upcoming events</button>
  </div>
  <div id="view" class="tasks" style="display:flex;flex-direction:column;flex:1;min-height:0"></div>
  <div class="bar">
    <button class="add" id="add">+ ADD TASK</button>
    <button class="ghost" id="extra" hidden>CLEAR PAST EVENTS</button>
    <p class="hint" id="hint">Changes save automatically and appear on the wallpaper in a few seconds.</p>
  </div>
  <div class="foot"><span id="count">00 RECORDS</span><span>YAN BRIDGE <span style="color:#858a6b">●</span> LOCAL</span></div>
</div>
<script>
(function () {
  "use strict";
  var MAX_TASKS = 6, MAX_EVENTS = 30;
  var token = "";
  var m = /token=([0-9a-f]{32,})/i.exec(location.hash);
  if (m) { token = m[1]; try { sessionStorage.setItem("yan-token", token); } catch (e) {} history.replaceState(null, "", location.pathname + location.search); }
  else { try { token = sessionStorage.getItem("yan-token") || ""; } catch (e) {} }
  var view = new URLSearchParams(location.search).get("view") === "events" ? "events" : "tasks";
  var data = { tasks: [], events: [] };
  var saveTimer = 0, saving = false, pending = false;

  var $ = function (id) { return document.getElementById(id); };
  function pad(n) { return String(n).padStart(2, "0"); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function today() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function isPast(ev) {
    if (!ev.date) return false;
    var t = new Date(ev.date + "T" + (ev.time || "23:59") + ":00");
    return !isNaN(t) && t.getTime() < Date.now();
  }
  function state(text) { $("state").innerHTML = text; }

  function api(method, body) {
    return fetch("/api/planner?token=" + encodeURIComponent(token), {
      method: method, cache: "no-store",
      headers: body ? { "Content-Type": "text/plain" } : undefined,
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) { return r.json(); });
  }
  function load() {
    if (!token) { state("NO ACCESS TOKEN"); render(); return; }
    api("GET").then(function (res) {
      if (!res || !res.ok) throw new Error(res && res.error);
      data.tasks = (res.tasks || []).map(function (t) { return { text: t.text || "" }; });
      data.events = (res.events || []).map(function (e) { return { name: e.name || "", date: e.date || "", time: e.time || "" }; });
      state("SYNCED");
      render();
    }).catch(function () { state("YAN BRIDGE OFFLINE"); render(); });
  }
  function scheduleSave() {
    state("EDITING");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 500);
  }
  function save() {
    if (saving) { pending = true; return; }
    saving = true;
    state("SAVING");
    var body = {
      tasks: data.tasks.filter(function (t) { return t.text.trim(); }),
      events: data.events.filter(function (e) { return e.date; })
        .slice().sort(function (a, b) { return (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")); })
    };
    api("POST", body).then(function (res) {
      state(res && res.ok ? 'SAVED <i>●</i> ON WALLPAPER' : "COULD NOT SAVE");
    }).catch(function () { state("YAN BRIDGE OFFLINE"); })
      .finally(function () { saving = false; if (pending) { pending = false; save(); } });
  }

  function render(focus) {
    var tasks = view === "tasks";
    document.querySelectorAll("[data-view]").forEach(function (b) { b.setAttribute("aria-selected", String(b.dataset.view === view)); });
    $("title").textContent = tasks ? "TODAY'S TASKS" : "UPCOMING EVENTS";
    $("subtitle").textContent = tasks ? "Up to " + MAX_TASKS + " tasks" : "Countdowns on the wallpaper";
    $("add").textContent = tasks ? "+ ADD TASK" : "+ ADD EVENT";
    $("add").disabled = tasks ? data.tasks.length >= MAX_TASKS : data.events.length >= MAX_EVENTS;
    $("extra").hidden = tasks || !data.events.some(isPast);
    $("hint").textContent = tasks
      ? "Tick tasks as done on the wallpaper. Changes save automatically."
      : "The nearest upcoming event gets the countdown. Changes save automatically.";
    var v = $("view");
    v.className = tasks ? "tasks" : "events";
    var head = tasks
      ? '<div class="head"><span>NO.</span><span>TASK</span><span></span></div>'
      : '<div class="head"><span>NO.</span><span>EVENT</span><span>DATE</span><span>TIME</span><span></span></div>';
    var rows;
    if (tasks) {
      rows = data.tasks.length ? data.tasks.map(function (t, i) {
        return '<div class="row" data-i="' + i + '"><span class="no">' + pad(i + 1) + '</span>' +
          '<input type="text" maxlength="120" data-f="text" placeholder="Write a task…" value="' + esc(t.text) + '">' +
          '<span class="acts"><button data-act="up" title="Move up" aria-label="Move up">↑</button><button data-act="down" title="Move down" aria-label="Move down">↓</button>' +
          '<button class="del" data-act="del" title="Remove" aria-label="Remove">✕</button></span></div>';
      }).join("") : '<div class="empty"><strong>No tasks yet</strong>Use + ADD TASK to write what you want to finish today.</div>';
    } else {
      rows = data.events.length ? data.events.map(function (e, i) {
        var past = isPast(e);
        return '<div class="row' + (past ? " past" : "") + '" data-i="' + i + '"><span class="no">' + pad(i + 1) +
          (past ? '<span class="tag">PAST</span>' : "") + '</span>' +
          '<input type="text" maxlength="80" data-f="name" placeholder="Event name…" value="' + esc(e.name) + '">' +
          '<input type="date" data-f="date" value="' + esc(e.date) + '">' +
          '<input type="time" data-f="time" value="' + esc(e.time) + '">' +
          '<span class="acts"><button class="del" data-act="del" title="Remove" aria-label="Remove">✕</button></span></div>';
      }).join("") : '<div class="empty"><strong>No events yet</strong>Use + ADD EVENT to add a date to look forward to.</div>';
    }
    v.innerHTML = head + '<div class="list" id="list">' + rows + "</div>";
    var n = tasks ? data.tasks.length : data.events.length;
    $("count").textContent = pad(n) + (n === 1 ? " RECORD" : " RECORDS");
    if (focus != null) {
      var inp = v.querySelector('.row[data-i="' + focus + '"] input');
      if (inp) { inp.focus(); inp.scrollIntoView({ block: "nearest" }); }
    }
  }

  document.addEventListener("click", function (e) {
    var tab = e.target.closest("[data-view]");
    if (tab) { view = tab.dataset.view; render(); return; }
    var b = e.target.closest("button");
    if (!b) return;
    if (b.id === "add") {
      if (view === "tasks") { if (data.tasks.length < MAX_TASKS) data.tasks.push({ text: "" }); render(data.tasks.length - 1); }
      else { if (data.events.length < MAX_EVENTS) data.events.push({ name: "", date: today(), time: "" }); render(data.events.length - 1); }
      return;
    }
    if (b.id === "extra") { data.events = data.events.filter(function (ev) { return !isPast(ev); }); render(); save(); return; }
    var row = b.closest(".row");
    if (!row) return;
    var i = Number(row.dataset.i), list = view === "tasks" ? data.tasks : data.events;
    if (b.dataset.act === "del") list.splice(i, 1);
    if (b.dataset.act === "up" && i > 0) list.splice(i - 1, 0, list.splice(i, 1)[0]);
    if (b.dataset.act === "down" && i < list.length - 1) list.splice(i + 1, 0, list.splice(i, 1)[0]);
    render();
    save();
  });
  document.addEventListener("input", function (e) {
    var row = e.target.closest(".row");
    if (!row || !e.target.dataset.f) return;
    var list = view === "tasks" ? data.tasks : data.events;
    list[Number(row.dataset.i)][e.target.dataset.f] = e.target.value;
    scheduleSave();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.matches("input") && view === "tasks") { e.preventDefault(); $("add").click(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); clearTimeout(saveTimer); save(); }
  });
  window.addEventListener("beforeunload", function () { if (saveTimer) { clearTimeout(saveTimer); save(); } });

  render();
  load();
})();
</script>
</body>
</html>
